<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Over9kFPV</title>
<meta name="description" content="Over9kFPV: FPV drones, EdgeTX sound themes and videos.">
<style>
:root{--bg:#0b0d12;--card:#151924;--border:#252b3a;--text:#eef1f7;--muted:#8c95aa;--accent:#ff5a1f}
@media (prefers-color-scheme: light){:root{--bg:#f4f5f8;--card:#fff;--border:#dde1ea;--text:#151924;--muted:#5d667a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:100%;max-width:480px;padding:56px 16px 40px;text-align:center}
h1{margin:0 0 4px;font-size:2rem;letter-spacing:-.02em}
h1 span{color:var(--accent)}
p.tag{margin:0 0 32px;color:var(--muted)}
a.link{display:block;margin:0 0 12px;padding:16px 20px;background:var(--card);border:1px solid var(--border);border-radius:14px;color:inherit;text-decoration:none;font-weight:600;text-align:left;transition:transform .12s,border-color .12s}
a.link:hover,a.link:focus-visible{transform:translateY(-2px);border-color:var(--accent);outline:none}
a.link small{display:block;margin-top:2px;color:var(--muted);font-weight:400;font-size:.875rem}
</style>
</head>
<body>
<main>
  <h1>Over9k<span>FPV</span></h1>
  <p class="tag">FPV drones, EdgeTX sounds and videos</p>
  <a class="link" href="https://over9kfpv.github.io/stickbeats/">Stickbeats<small>Sound themes and voice packs for EdgeTX radios</small></a>
  <a class="link" href="https://www.youtube.com/@Over9Kfpv">YouTube<small>@Over9Kfpv</small></a>
  <a class="link" href="https://www.instagram.com/over9k.fpv/">Instagram<small>@over9k.fpv</small></a>
</main>
</body>
</html>
